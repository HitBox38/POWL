name: Android APK

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Check types, lint, and regression tests
        run: |
          npx tsc --noEmit
          npm run lint
          npm test

      - name: Check Metro configuration and native styling dependencies
        run: node -e "require('./metro.config.js')"

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      # Expo's generated release variant bundles JS/assets and uses its bundled
      # debug signing key. This is a standalone personal-testing build, not a
      # Play Store release; no Expo account or signing secrets are required.
      - name: Build APK
        working-directory: android
        # SDK 57 exceeds the template's 512 MiB Metaspace limit during release lint.
        # Keep Kotlin in the same JVM and fail promptly on memory exhaustion.
        run: >-
          bash ./gradlew :app:assembleRelease --no-daemon --max-workers=2
          '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+ExitOnOutOfMemoryError'
          -Pkotlin.compiler.execution.strategy=in-process
          -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Verify and name APK
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          unzip -l "$apk" > /tmp/powl-apk-contents.txt
          grep -q 'assets/index.android.bundle' /tmp/powl-apk-contents.txt
          grep -q 'lib/arm64-v8a/libreactnative.so' /tmp/powl-apk-contents.txt
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$apksigner" verify "$apk"
          mkdir -p artifacts
          cp "$apk" "artifacts/POWL-dev-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: POWL-dev-${{ github.run_number }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Add download instructions
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo '### POWL for Android'
            echo "[Download APK artifact]($ARTIFACT_URL) (sign in to GitHub)."
            echo 'Extract the ZIP, open the APK on your Android phone, and allow installation from that browser or file manager if prompted.'
            echo 'Runs independently of Expo Go and Metro. Supports ARM64 and ARMv7 phones.'
            echo 'Personal testing only: signed with the Expo template debug key.'
          } >> "$GITHUB_STEP_SUMMARY"
